name: Stamped
description: >-
  Stamped is a reviews, ratings, and loyalty platform for e-commerce brands on
  Shopify, BigCommerce, and custom/headless platforms. Its V3 API is organized
  into three domains: Merchant Data (customers, products, orders), Loyalty
  Operations (points adjustments, VIP tiers, reward redemption, activities, and
  program reporting), and Reviews. Authentication is a shop-scoped Private API
  Key sent in the stamped-api-key header. Surfaced as a portfolio company of GV
  and enriched by the API Evangelist pipeline from Stamped's public developer
  documentation at developers.stamped.io.
